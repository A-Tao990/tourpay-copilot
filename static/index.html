<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TourPay Copilot</title>
<style>
:root{--bg:#0f1720;--card:#17212d;--ink:#e8eef5;--mut:#8fa3b8;--acc:#2f9e7a;--warn:#e0a030;--line:#243344}
@media(prefers-color-scheme:light){:root{--bg:#f4f7fa;--card:#fff;--ink:#14202b;--mut:#5b6d7e;--line:#dbe3ea}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:20px;margin:0}.badges span{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
#log{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:var(--acc);color:#fff}.b{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
form{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{padding:9px 14px;border-radius:8px;border:0;background:var(--acc);color:#fff;font:inherit;cursor:pointer}button.s{background:transparent;color:var(--mut);border:1px solid var(--line)}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}a{color:var(--acc)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.note{color:var(--mut);font-size:12px}
</style></head><body><main>
<header><h1>TourPay Copilot <span class="note">AI payment assistant for tourists in Vietnam</span></h1><div class="badges" id="badges"></div></header>
<div class="card"><div id="log"></div>
<form id="f"><input id="q" autocomplete="off" placeholder="e.g. 3 x 45k + 80k, pay in USD  /  账单 450,000 越南盾,用美元付  /  tổng 1,2 triệu, thanh toán EUR"><button>Send</button></form>
<div class="ex" id="ex"></div>
<p class="note">Sandbox demo: no real money moves. Rates are mid-market; PayPal adds its own spread and fees. Not legal or financial advice.</p></div>
<div class="card"><b>Merchant dashboard</b> <span class="note" id="dd"></span> <a href="/api/export.csv" class="note">download CSV</a><div id="sum" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px"></div></div>
<div class="card"><b>Orders</b> <button class="s" id="rf">refresh</button><table id="ot"></table></div>
</main><script>
const $=s=>document.querySelector(s),log=$('#log');
const EX=['3 x 45k + 80k, pay in USD','账单 450,000 越南盾,用美元付','tổng 1,2 triệu, thanh toán bằng EUR','how can I pay in Vietnam?','status','confirm payment','refund'];
EX.forEach(t=>{const b=document.createElement('button');b.className='s';b.type='button';b.textContent=t;b.onclick=()=>{$('#q').value=t;$('#f').requestSubmit()};$('#ex').append(b)});
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.innerHTML=t.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])).replace(/(https?:\/\/[^\s]+|\/mock\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>');log.append(d);log.scrollTop=1e9}
async function orders(){const o=await (await fetch('/api/orders')).json();$('#ot').innerHTML='<tr><th>Order</th><th>VND</th><th>Charge</th><th>Status</th></tr>'+o.map(x=>`<tr><td>${x.id}</td><td>${x.amount_vnd.toLocaleString()}</td><td>${x.value} ${x.currency}</td><td>${x.status}</td></tr>`).join('')}
async function summary(){const s=await (await fetch('/api/summary')).json();$('#dd').textContent='(today '+s.date+', '+s.timezone+')';const t=s.today,a=s.all,f=o=>Object.entries(o).map(([k,v])=>v+' '+k).join(', ')||'-';
 const box=(h,v)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:8px"><div class="note">${h}</div><b>${v}</b></div>`;
 $('#sum').innerHTML=box('Orders today',t.orders+' ('+t.completed+' paid, '+t.pending+' pending, '+t.refunded+' refunded)')+box('Collected today (VND)',t.vnd_collected.toLocaleString())+box('Charged today',f(t.collected_by_currency))+box('Refunded today',f(t.refunded_by_currency))+box('All time paid',a.completed+' / '+a.vnd_collected.toLocaleString()+' VND')}
async function health(){const h=await (await fetch('/api/health')).json();$('#badges').innerHTML=`<span>PayPal: ${h.paypal}</span><span>AI: ${h.brain}</span><span>FX: ${h.fx}</span>`}
$('#f').onsubmit=async e=>{e.preventDefault();const t=$('#q').value.trim();if(!t)return;add(t,'u');$('#q').value='';
 const r=await (await fetch('/api/chat',{method:'POST',body:JSON.stringify({message:t})})).json();add(r.reply,'b');orders();summary()};
$('#rf').onclick=orders;
const p=new URLSearchParams(location.search);add('Hi! Tell me an amount in VND and the currency you want to pay in. I speak 中文 / English / Tiếng Việt.','b');
if(p.get('paid'))add('PayPal returned for order '+p.get('paid')+'. Say "status" to check it.','b');
health();orders();summary();
</script></body></html>
